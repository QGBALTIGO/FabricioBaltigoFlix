name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - name: Replace desktop OpenCV with headless runtime
        run: sh scripts/use-headless-opencv.sh

      - name: Validate exact OCR runtime path
        run: |
          python - <<'PY'
          import cv2
          import onnxruntime
          from app.intake import _get_ocr_engine

          engine = _get_ocr_engine()
          assert engine is not None
          print("cv2:", cv2.__version__)
          print("onnxruntime:", onnxruntime.__version__)
          print("RapidOCR production constructor ready")
          PY

      - run: python -m compileall -q app
      - run: python -m pytest -q

      - name: Validate image scanner inside production-like slim container
        run: |
          docker build -t melhor-rastreio-image-smoke .
          docker run --rm melhor-rastreio-image-smoke \
            python -m pytest -q \
            tests/test_ocr_integration.py \
            tests/test_smart_intake.py \
            tests/test_barcode_scanner.py
