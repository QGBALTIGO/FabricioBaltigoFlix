services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rastreio
      POSTGRES_USER: rastreio
      POSTGRES_PASSWORD: rastreio
    volumes:
      - rastreio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rastreio"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rastreio:rastreio@db:5432/rastreio
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  rastreio_pg:
